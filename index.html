<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!--เมนู-->
<div id="menu-container"></div>

<!--เนื้อหา-->
<div class="container">
<div class="alert alert-danger mt-4" role="alert">
  Danger! Danger! Danger!
</div>

<div class="row">
    <div class = "col-md-6">
        <!---form--->
        <form>
            <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label">Tel</label>
            <input type="text" class="form-control" id="tel" placeholder="ex.038-743690" required>
            </div>
            <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label">Example textarea</label>
            <textarea class="form-control" id="detail" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-success">Submit</button>
                <button type="reset" class="btn btn-danger">Cancel</button>
            </div>
        </form>
    </div>

    <div class = "col-md-6">
        <img src="image/69e5b455a27364d29b585687e506703e.jpg" width="100%" class="img-fluid rounded">
    </div>
    
</div>
</div>
</body>
</html>

<script src="js/bootstrap.bundle.min.js" ></script>
