<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link href="css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <!--เมนู-->
        <div id="menu-container"></div>
        <!--เนื้อหา-->
        <div class="container">
            <div class="container-fluid p-0">
                <img src="image/siteheader_polarBearCafe_938×326.jpg" class="img-fluid w-100" alt="Polar Bear Cafe">
            </div>
            <div class="container marketing">
                
                <div class="container py-5">
  <div class="row text-center">

    <!-- Email -->
    <div class="col-lg-4">
      <div class="rounded-circle bg-secondary mx-auto mb-3 d-flex align-items-center justify-content-center"
           style="width:140px; height:140px;">
        <i class="bi bi-envelope-fill text-white" style="font-size:50px;"></i>
      </div>
      <h2>Email</h2>
      <p>Contact us via email for inquiries or support.</p>
      <p>
        <a class="btn btn-secondary" href="mailto:your@email.com">
          Send Email »
        </a>
      </p>
    </div>

    <div class="col-lg-4">
      <div class="rounded-circle bg-secondary mx-auto mb-3 d-flex align-items-center justify-content-center"
           style="width:140px; height:140px;">
        <i class="bi bi-facebook text-white" style="font-size:50px;"></i>
      </div>
      <h2>Facebook</h2>
      <p>Follow us on Facebook for updates and news.</p>
      <p>
        <a class="btn btn-secondary" href="https://facebook.com/yourpage" target="_blank">
          Visit Facebook »
        </a>
      </p>
    </div>

    <!-- Instagram -->
    <div class="col-lg-4">
      <div class="rounded-circle bg-secondary mx-auto mb-3 d-flex align-items-center justify-content-center"
           style="width:140px; height:140px;">
        <i class="bi bi-instagram text-white" style="font-size:50px;"></i>
      </div>
      <h2>Instagram</h2>
      <p>Check out our latest photos and stories.</p>
      <p>
        <a class="btn btn-secondary" href="https://instagram.com/yourpage" target="_blank">
          Visit Instagram »
        </a>
      </p>
    </div>

  </div>
</div>

        </body>
    </html>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/menu.js"></script>
